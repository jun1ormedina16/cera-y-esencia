<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cera & Esencia | Catálogo Artesanal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Encabezado en Texto Animado Mobile-First -->
  <header class="header">
    <div class="brand-container">
      <div class="candle-icon">
        <div class="flame"></div>
        <div class="wick"></div>
        <div class="candle-body"></div>
      </div>
      <h1 class="brand-title">CERA <span class="ampersand">&</span> ESENCIA</h1>
      <p class="brand-subtitle">Velas y Recordatorios Artesanales</p>
    </div>
    <div class="header-divider"></div>
    <p class="catalog-tag">Catálogo de Velas & Combos</p>
  </header>

  <!-- Categorías con Scroll Horizontal -->
  <nav class="categories">
    <button class="cat-btn active" onclick="filtrar('todos')">Todos</button>
    <button class="cat-btn" onclick="filtrar('combos')">📦 Combos de Velones</button>
    <button class="cat-btn" onclick="filtrar('unidad')">Velas por Unidad 🕯️</button>
    <button class="cat-btn" onclick="filtrar('intencion')">Velas de Intención</button>
    <button class="cat-btn" onclick="filtrar('religioso')">Religiosos & Devocionales</button>
    <button class="cat-btn" onclick="filtrar('decorativo')">Decorativos & Sets</button>
  </nav>

  <!-- Grilla de Productos -->
  <main class="container">
    <section class="grid" id="productos-grid"></section>
  </main>

  <!-- Barra Flotante Inferior de WhatsApp -->
  <div class="cart-bar" id="cart-bar">
    <div class="cart-info">
      <span id="cart-count">0 productos seleccionados</span>
      <span id="cart-total" class="cart-total">$0 COP</span>
    </div>
    <button id="btn-whatsapp" onclick="enviarWhatsApp()">Pedir por WhatsApp 🚀</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
